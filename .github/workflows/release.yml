name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Reproducible flags per S10 M6 + S12 §8: -trimpath preserves go.mod
      # so runtime/debug.ReadBuildInfo() yields version/commit at runtime.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOFLAGS: '-trimpath -mod=readonly'
        run: |
          mkdir -p dist
          for cmd in leah leah-daemon leah-hud; do
            go build -ldflags="-s -w -buildid=" -o "dist/$cmd" "./cmd/$cmd"
          done

      # Pre-signing tarball + checksums. `make verify-checksums` compares a
      # local rebuild against THIS file, since signing perturbs Mach-O bytes
      # and a locally-built binary can never hash-match a signed+stapled one.
      - name: Tarball + SHA256 (unsigned)
        run: |
          cd dist
          tar czf "leah-${GITHUB_REF_NAME}-darwin-arm64-unsigned.tar.gz" leah leah-daemon leah-hud
          shasum -a 256 ./*-unsigned.tar.gz > SHA256SUMS.unsigned

      - name: Import Developer ID cert
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVID_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVID_PASSWORD }}
        run: scripts/release/import-cert.sh

      - name: Codesign
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          for cmd in leah leah-daemon leah-hud; do
            codesign --options runtime --timestamp --sign "$SIGN_IDENTITY" "dist/$cmd"
            codesign --verify --strict --verbose=2 "dist/$cmd"
          done

      - name: Notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize.sh dist/leah dist/leah-daemon dist/leah-hud

      - name: Verify signed + notarized
        run: scripts/release/verify-signed.sh dist/leah dist/leah-daemon dist/leah-hud

      - name: Tarball + SHA256 (signed)
        run: |
          cd dist
          tar czf "leah-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" leah leah-daemon leah-hud
          shasum -a 256 "leah-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" > SHA256SUMS

      # Source tarball the brew formula's `url` stanza references. Without
      # this step `brew install leah` 404s on the formula URL (MAY-268).
      - name: Source tarball + sidecar SHA256
        env:
          TAG: ${{ github.ref_name }}
        run: TAG="$TAG" OUT_DIR=dist scripts/release/publish-tarball.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
            dist/SHA256SUMS.unsigned

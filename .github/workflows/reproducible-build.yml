name: reproducible-build

# W135 / S10 / M6: reproducible build + SBOM (syft) + SLSA L2 provenance
# (slsa-github-generator) + cosign keyless sign-blob. Triggered on v* tag push.
# Spec: docs/engineer/specs/2026-06-10-trust-moats.md §7
# Operator doc: docs/operator/reproducible-build.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag) to build'
        required: true
        type: string

permissions:
  contents: read

env:
  # Reproducibility flags — every byte of the binary must be deterministic.
  # -trimpath strips $GOPATH; -mod=readonly forbids go.mod mutation;
  # -buildid= zeroes the build-id stamp; -s -w drops symbol + DWARF tables.
  GOFLAGS: '-trimpath -mod=readonly'
  CGO_ENABLED: '0'
  LDFLAGS: '-s -w -buildid='

jobs:
  build:
    name: build + sbom + checksum
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify go.mod
        run: |
          go mod download
          go mod verify

      - name: Build leah
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -o "dist/leah-${GOOS}-${GOARCH}" ./cmd/leah
          go build -ldflags="${LDFLAGS}" -o "dist/leah-daemon-${GOOS}-${GOARCH}" ./cmd/leah-daemon

      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: leah-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json
          output-file: dist/leah-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json

      - name: Compute SHA256 checksums
        working-directory: dist
        run: |
          sha256sum leah-${{ matrix.goos }}-${{ matrix.goarch }} \
                    leah-daemon-${{ matrix.goos }}-${{ matrix.goarch }} \
                    leah-${{ matrix.goos }}-${{ matrix.goarch }}.spdx.json \
            > SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Export per-artifact digests for SLSA provenance
        id: hash
        working-directory: dist
        run: |
          # base64-encoded SHA256SUMS payload — input format expected by
          # slsa-github-generator/generator_generic_slsa3.yml.
          digests=$(sha256sum leah-${{ matrix.goos }}-${{ matrix.goarch }} \
                              leah-daemon-${{ matrix.goos }}-${{ matrix.goarch }} \
                    | base64 -w0)
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leah-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  provenance:
    name: slsa L2 provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Pin to a specific tag (spec §15 risk #2: avoid @main drift).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: true
      provenance-name: leah.intoto.jsonl

  sign:
    name: cosign keyless sign
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Aggregate SHA256SUMS
        working-directory: dist
        run: |
          # Per-matrix SHA256SUMS-* files merge into one signed top-level file.
          cat ./*/SHA256SUMS-* > SHA256SUMS
          shasum -a 256 SHA256SUMS

      - name: cosign sign-blob (keyless, Sigstore OIDC)
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Attach signed checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/SHA256SUMS.pem \
            --clobber

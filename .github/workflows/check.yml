name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: build + test + vet + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify go.mod
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  # pr-gates wires the audit-session gates into pull_request runs so
  # they cannot be bypassed by an operator skipping ./scripts/check.sh
  # locally — that exact pattern shipped #162/#199/#219 (TDD-evidence
  # misses) and #184/#186/#187 (APPROVE-token leaks). Both scripts are
  # body-only / network-light and run independent of the build job.
  pr-gates:
    name: pr-gates (reviewer-verdict + tdd-evidence)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-tdd-evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/check-tdd-evidence.sh --pr "$PR_NUMBER" --branch "$HEAD_REF"
